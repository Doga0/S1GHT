.reveal{animation:reveal 12.5s linear infinite}
.cursor{animation:cursor 12.5s linear infinite}
@keyframes done{0%,71.0%{opacity:0}74.0%,100%{opacity:1}}
.done{animation:done 12.5s linear infinite}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;width:578px}.cursor{display:none}.done{animation:none}}
</style>
