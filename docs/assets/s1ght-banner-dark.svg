<title id="t">S1GHT — Real-Time Visual Decisions</title>
<desc id="d">A recorded S1GHT run: d1-omni-600M is asked "Is the person wearing a hard hat?" about two tracked people for 14 seconds. The worker in a red hard hat stays near 0.8 and raises an event; the man without one stays near 0.4, inside the uncertain band, so the scheduler keeps asking about him.</desc>
