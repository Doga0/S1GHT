    llama_server: {model: h2o-lightning-4b}   # llama-server -hf h2oai/h2o-lightning-4b-gguf:Q8_0 (build b11773+); no box
  calibration: null
  license: apache-2.0
  notes: Box answers come from the model's own shim (vLLM, or a pinned llama.cpp with the stock- GGUF); llama-server alone has no box question.
