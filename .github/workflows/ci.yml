name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  base:
    # Torch-free environment: core import + unit tests.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,serve]"
      - name: import s1ght without torch
        run: python -c "import importlib.util as u, s1ght; assert u.find_spec('torch') is None; print(s1ght.__version__)"
      - run: ruff check .
      - run: pytest

  native:
    # CPU torch environment: slow-marked tests. GPU tests run on a self-hosted runner later.
    runs-on: ubuntu-latest
    needs: base
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[native,dev]"
      - run: pytest -m "not gpu and not network"
