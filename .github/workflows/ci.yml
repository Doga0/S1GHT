name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  base:
    # Core import (no torch) + unit tests.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,serve]"
      - name: import s1ght without torch
        run: python -c "import importlib.util as u, s1ght; assert u.find_spec('torch') is None; print(s1ght.__version__)"
      - run: ruff check .
      - run: pytest

  package:
    # the sdist and wheel build, hold the package data, and render on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: python scripts/check_dist.py dist/
      - run: twine check --strict dist/*
