[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "s1ght"
version = "0.1.0.dev0"
description = "S1GHT — Real-Time Visual Decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24", "pillow>=10", "opencv-python-headless>=4.8",
  "httpx>=0.27", "pyyaml>=6", "huggingface_hub>=0.24",
]

[project.optional-dependencies]
native = ["torch>=2.4", "transformers>=5.14", "accelerate"]   # d1-3B transformers>=5.14 istiyor
ultralytics = ["ultralytics>=8.4", "lap>=0.5.12"]             # AGPL-3.0; lap: ByteTrack (else auto-installed at run time)
serve = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML", "typesafe-sdk"]   # typesafe-sdk: `serve` compatibility test
all = ["s1ght[native,ultralytics,serve]"]

[project.scripts]
s1ght = "s1ght.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s1ght"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: CUDA gerektirir", "network: ağ veya sunucu gerektirir", "slow: uzun sürer"]
addopts = "-m 'not gpu and not network and not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
